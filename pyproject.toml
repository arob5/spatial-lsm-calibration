[project]
name = "spatial-lsm-calibration"
version = "0.1.0"
description = "Bayesian parameter estimation demo for the SIPNET land-surface model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysipnet",
    "probpipe",
    "pyens",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "arviz>=0.13",
    "jax[cpu]>=0.4",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbconvert",
]

[tool.uv.sources]
pysipnet = { path = "../pySIPNET", editable = true }
pyens = { path = "../PyEns", editable = true }
probpipe = { path = "../prob-pipe", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["sipnet_calibration"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
