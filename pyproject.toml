[project]
name = "sipnet-calibration"
version = "0.1.0"
description = "Scalable Bayesian multi-site parameter calibration for the SIPNET land-surface model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysipnet",
    # The xarray extra provides pyens.xarray, which builds PyEns field specs
    # from xarray objects.
    "pyens[xarray]",
    "pyeki",
    "numpy>=1.24",
    "pandas>=2.0",
    # Field container: xr.DataArray with dims subset of (member, site, time).
    "xarray>=2024.1",
    # Non-standard-calendar netCDF decoding. Note this does NOT rescue the IC
    # files: their units attribute is a literal unsubstituted template,
    # "days since [year]-01-01 00:00:00 UTC", which no calendar library can
    # parse. The IC adapter must use decode_times=False.
    "cftime>=1.6",
    "h5netcdf>=1.3",
    # Processed store for the (*batch, site, time) arrays; open_zarr().sel(site=...)
    # is the adapter, with no reshape step. dask is not optional here: chunked
    # (i.e. lazy per-site) reads are the entire reason for choosing zarr.
    "zarr>=2.17",
    "dask[array]>=2024.1",
    "scipy>=1.11",
    # Reads the tracked point shapefile in data/raw/sites/. Pure Python, so it
    # needs no system GDAL. Used by scripts/ingest_sites.py and the tests,
    # never by the library itself.
    "pyshp>=3.1",
    "matplotlib>=3.7",
    "arviz>=0.13",
    "jax[cpu]>=0.4",
    # Priors and bijectors for sipnet_calibration.parameter_vector come from
    # TensorFlow Probability's JAX substrate, imported as
    # tensorflow_probability.substrates.jax, never from in-house code. The
    # stable tensorflow-probability release lags JAX, so the nightly channel
    # is the right one; uv.lock pins the dated build. Verified on Python 3.14
    # with jax 0.8.3 and no TensorFlow installed (the 2026-09-21 build in a
    # scratch venv, the 2026-09-22 build that the lock pins).
    "tfp-nightly",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbconvert",
    # PROJ, through pyproj, is what sipnet_calibration.projection applies; the
    # module owns the choice of projection and its stored definition, not any
    # formula.
    #
    # The floor is deliberately low. Nothing here needs an API newer than
    # pyproj 3.1, and each release raises a platform floor: 3.7.2 and 3.8 need
    # glibc 2.28 on Linux (RHEL 8+) where 3.7.1 built against 2.17 (RHEL 7),
    # and 3.8 needs macOS 15 on Intel where 3.7.x needs 13. Leaving 3.7.1
    # admissible lets an older cluster node resolve this environment on Python
    # 3.13 while this machine takes 3.8 on 3.14. All three were checked to
    # produce byte-identical output, PROJJSON schema version included.
    #
    # cartopy is deliberately absent. Its wheels now cover 3.14 (0.26.0 ships
    # cp314 arm64), but the maps are drawn on plain Axes in projected meters,
    # with a basemap vendored from Natural Earth by scripts/build_basemap.py,
    # so neither GeoAxes nor a run-time download of coastlines is needed.
    "pyproj>=3.7.1",
    # The package's read-only mappings. A dict subclass, so pandas, json,
    # pickle and copy treat one as a dict, and hashable by its items.
    "frozendict>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The three companion packages are developed alongside this project rather than
# released, so they are tracked by branch and pinned to an exact commit in
# uv.lock. A run's environment is therefore reproducible, and a companion moves
# forward only when `uv lock --upgrade-package <name>` says so. See the README
# for the upgrade and local-development workflows.
[tool.uv.sources]
pysipnet = { git = "https://github.com/TARPS-group/pySIPNET.git", branch = "main" }
pyens = { git = "https://github.com/arob5/PyEns.git", branch = "main" }
pyeki = { git = "https://github.com/TARPS-group/pyEKI.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/sipnet_calibration"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: exercises the real source data end to end; takes tens of seconds",
]

[tool.ruff.lint.isort]
# conftest is the test suite's own module, imported beside the package's.
known-first-party = ["sipnet_calibration", "conftest"]
