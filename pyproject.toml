[project]
name = "sipnet-calibration"
version = "0.1.0"
description = "Scalable Bayesian multi-site parameter calibration for the SIPNET land-surface model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysipnet",
    "pyens",
    "pyeki",
    "numpy>=1.24",
    "pandas>=2.0",
    # Canonical field container: xr.DataArray with dims subset of (member, site, time).
    "xarray>=2024.1",
    # Non-standard-calendar netCDF decoding. Note this does NOT rescue the IC
    # files: their units attribute is a literal unsubstituted template,
    # "days since [year]-01-01 00:00:00 UTC", which no calendar library can
    # parse. The IC adapter must use decode_times=False.
    "cftime>=1.6",
    "h5netcdf>=1.3",
    # Processed store for the (member, site, time) blocks; open_zarr().sel(site=...)
    # is the adapter, with no reshape step. dask is not optional here: chunked
    # (i.e. lazy per-site) reads are the entire reason for choosing zarr.
    "zarr>=2.17",
    "dask[array]>=2024.1",
    "scipy>=1.11",
    # Reads the tracked point shapefile in data/raw/sites/. Pure Python, so it
    # needs no system GDAL. Used by scripts/ingest_sites.py and the tests,
    # never by the library itself.
    "pyshp>=3.1",
    "matplotlib>=3.7",
    "arviz>=0.13",
    "jax[cpu]>=0.4",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbconvert",
    # PROJ, through pyproj, is what sipnet_calibration.projection applies; the
    # module owns the choice of projection and its stored definition, not any
    # formula. The floor is 3.7.2 because that is the oldest release with a
    # wheel for this project's Python, and it keeps two floors lower than 3.8
    # does: macOS 13 rather than 15 on Intel, though both need macOS 14 on
    # arm64. Both need glibc 2.28 on Linux -- RHEL 8 or newer -- where 3.7.1
    # still built against 2.17; check that before assuming an older cluster
    # node resolves. Nothing here needs an API newer than pyproj 3.1.
    #
    # cartopy is absent for an unrelated reason: its arm64 wheels stop at cp313
    # while the development venv is on 3.14. Nothing in this project's metadata
    # excludes it -- requires-python is >=3.12 -- so adopting it would mean
    # adding an upper bound that does not exist today.
    "pyproj>=3.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The three companion packages are developed alongside this project rather than
# released, so they are tracked by branch and pinned to an exact commit in
# uv.lock. A run's environment is therefore reproducible, and a companion moves
# forward only when `uv lock --upgrade-package <name>` says so. See the README
# for the upgrade and local-development workflows.
[tool.uv.sources]
pysipnet = { git = "https://github.com/TARPS-group/pySIPNET.git", branch = "main" }
pyens = { git = "https://github.com/arob5/PyEns.git", branch = "main" }
pyeki = { git = "https://github.com/TARPS-group/pyEKI.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/sipnet_calibration"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: exercises the real source data end to end; takes tens of seconds",
]
