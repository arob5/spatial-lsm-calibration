<svg xmlns="http://www.w3.org/2000/svg" class="ec-diagram" viewBox="0 0 1400 660" width="100%" role="img" aria-label="An eddy-covariance flux tower above a forest canopy">
  <defs>
    <marker id="ec-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4652"/>
    </marker>
    <marker id="ec-eddy-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <marker id="ec-uptake-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009E73"/>
    </marker>
    <marker id="ec-release-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d4b"/>
    </marker>
    <style>
      .ec-diagram text { font-family: inherit; fill: #1b241f; }
      .ec-name { font-size: 25px; font-weight: 600; }
      .ec-gloss { font-size: 20px; fill: #56635b; }
      .ec-leader { stroke: #56635b; stroke-width: 1.5; fill: none; }
      .ec-eddy { stroke: #0072B2; stroke-width: 3; fill: none; marker-end: url(#ec-eddy-head); }
      .ec-tower { stroke: #3b4652; stroke-width: 3; fill: none; }
      .ec-instrument { fill: #fbe9df; stroke: #D55E00; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- ── sky and ground ── -->
  <rect x="0" y="0" width="1400" height="560" fill="#eef5fb"/>
  <rect x="0" y="560" width="1400" height="100" fill="#f3ece2"/>
  <line x1="0" y1="560" x2="1400" y2="560" stroke="#8a6d4b" stroke-width="2"/>

  <!-- ── the canopy ── -->
  <g id="canopy">
    <line x1="20" y1="510" x2="20" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="20" cy="463" rx="51" ry="55" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="100" y1="516" x2="100" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="100" cy="469" rx="56" ry="56" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="187" y1="515" x2="187" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="187" cy="465" rx="48" ry="58" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="262" y1="513" x2="262" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="262" cy="462" rx="51" ry="60" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="341" y1="504" x2="341" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="341" cy="458" rx="60" ry="54" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="434" y1="502" x2="434" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="434" cy="454" rx="50" ry="56" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="511" y1="507" x2="511" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="511" cy="458" rx="55" ry="57" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="597" y1="508" x2="597" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="597" cy="459" rx="49" ry="57" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="673" y1="495" x2="673" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="673" cy="454" rx="52" ry="48" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="754" y1="503" x2="754" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="754" cy="454" rx="55" ry="57" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="839" y1="514" x2="839" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="839" cy="463" rx="58" ry="59" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="928" y1="498" x2="928" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="928" cy="453" rx="59" ry="53" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="1020" y1="509" x2="1020" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="1020" cy="468" rx="60" ry="49" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="1114" y1="514" x2="1114" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="1114" cy="462" rx="51" ry="60" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="1193" y1="504" x2="1193" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="1193" cy="461" rx="57" ry="52" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="1281" y1="504" x2="1281" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="1281" cy="459" rx="53" ry="52" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
    <line x1="1364" y1="509" x2="1364" y2="560" stroke="#8a6d4b" stroke-width="7"/>
    <ellipse cx="1364" cy="458" rx="56" ry="59" fill="#cfe6d6" stroke="#009E73" stroke-width="2"/>
  </g>

  <!-- ── the footprint, upwind of the tower, over the canopy ── -->
  <ellipse cx="470" cy="430" rx="300" ry="30" fill="#D55E00" fill-opacity="0.22" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- ── fluxes at the canopy: uptake and release ── -->
  <g id="canopy-fluxes">
    <line x1="1060" y1="330" x2="1060" y2="395" stroke="#009E73" stroke-width="3.5" marker-end="url(#ec-uptake-head)"/>
    <line x1="1100" y1="330" x2="1100" y2="395" stroke="#009E73" stroke-width="3.5" marker-end="url(#ec-uptake-head)"/>
    <text class="ec-gloss" x="1080" y="312" text-anchor="middle" style="fill:#009E73">uptake (GPP)</text>
    <line x1="1240" y1="395" x2="1240" y2="330" stroke="#8a6d4b" stroke-width="3.5" marker-end="url(#ec-release-head)"/>
    <line x1="1280" y1="395" x2="1280" y2="330" stroke="#8a6d4b" stroke-width="3.5" marker-end="url(#ec-release-head)"/>
    <text class="ec-gloss" x="1260" y="312" text-anchor="middle" style="fill:#8a6d4b">release (R<tspan baseline-shift="sub" font-size="15">a</tspan> + R<tspan baseline-shift="sub" font-size="15">h</tspan>)</text>
  </g>

  <!-- ── eddies, and the mean wind ── -->
  <g id="eddies">
    <path class="ec-eddy" d="M914,230 A46,46 0 1 1 960,276"/>
    <path class="ec-eddy" d="M1132,180 A38,38 0 1 0 1170,142"/>
    <path class="ec-eddy" d="M1050,255 A30,30 0 1 1 1080,285"/>
    <path class="ec-eddy" d="M290,300 A40,40 0 1 0 330,260"/>
    <path class="ec-eddy" d="M488,330 A32,32 0 1 1 520,362"/>
    <text class="ec-name" x="1000" y="80">Turbulent eddies</text>
    <text class="ec-gloss" x="1000" y="108">carry CO₂ up and down</text>
  </g>
  <line x1="60" y1="210" x2="300" y2="210" stroke="#3b4652" stroke-width="4" marker-end="url(#ec-head)"/>
  <text class="ec-gloss" x="60" y="196">mean wind</text>

  <!-- ── the tower and its instruments ── -->
  <g id="tower">
    <g class="ec-tower">
      <line x1="742" y1="560" x2="756" y2="150"/>
      <line x1="798" y1="560" x2="784" y2="150"/>
      <path d="M742,560 L795,480 L745,400 L792,320 L748,240 L789,170"/>
      <path d="M798,560 L745,480 L795,400 L748,320 L792,240 L751,170"/>
      <line x1="770" y1="160" x2="680" y2="160"/>
    </g>
    <!-- sonic anemometer: a post with three arms -->
    <line x1="672" y1="160" x2="672" y2="108" stroke="#D55E00" stroke-width="3"/>
    <line x1="672" y1="112" x2="648" y2="96" stroke="#D55E00" stroke-width="3"/>
    <line x1="672" y1="112" x2="696" y2="96" stroke="#D55E00" stroke-width="3"/>
    <line x1="672" y1="112" x2="672" y2="90" stroke="#D55E00" stroke-width="3"/>
    <!-- gas analyzer: a short open path below the boom -->
    <rect class="ec-instrument" x="700" y="166" width="20" height="46" rx="6" transform="rotate(-20 710 189)"/>
  </g>

  <!-- ── labels ── -->
  <path class="ec-leader" d="M600,72 L648,92"/>
  <text class="ec-name" x="595" y="58" text-anchor="end">Sonic anemometer</text>
  <text class="ec-gloss" x="595" y="84" text-anchor="end">3-D wind, including vertical wind <tspan font-style="italic">w</tspan></text>
  <path class="ec-leader" d="M600,150 L698,186"/>
  <text class="ec-name" x="595" y="136" text-anchor="end">Gas analyzer</text>
  <text class="ec-gloss" x="595" y="162" text-anchor="end">CO₂ density <tspan font-style="italic">c</tspan></text>
  <text class="ec-gloss" x="595" y="188" text-anchor="end">both sampled 10–20 times a second</text>
  <text class="ec-name" x="470" y="612" text-anchor="middle" style="fill:#D55E00">Footprint</text>
  <text class="ec-gloss" x="470" y="640" text-anchor="middle">the upwind area the flux represents</text>
  <path class="ec-leader" d="M470,590 L470,460" style="stroke:#D55E00"/>
</svg>
