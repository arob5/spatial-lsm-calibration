<svg xmlns="http://www.w3.org/2000/svg" class="bm-diagram" viewBox="0 0 1400 640" width="100%" role="img" aria-label="Carbon pools and fluxes of a land surface model">
  <defs>
    <marker id="bm-flux-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4652"/>
    </marker>
    <marker id="bm-observation-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
    <style>
      .bm-diagram text { font-family: inherit; fill: #1b241f; }
      .bm-pool { fill: #f4f7fa; stroke: #3b4652; stroke-width: 2; }
      .bm-pool-name { font-size: 26px; font-weight: 600; text-anchor: middle; }
      .bm-flux { stroke: #3b4652; stroke-width: 3; fill: none; marker-end: url(#bm-flux-head); }
      .bm-flux-name { font-size: 24px; font-weight: 600; }
      .bm-flux-gloss { font-size: 19px; fill: #56635b; }
      .bm-region { font-size: 20px; fill: #56635b; letter-spacing: 0.06em; }
      .bm-observed { fill: none; stroke: #D55E00; stroke-width: 4; }
      .bm-beam { stroke: #D55E00; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; marker-end: url(#bm-observation-head); }
      .bm-observation-name { font-size: 21px; font-weight: 600; fill: #D55E00; }
      .bm-observation-gloss { font-size: 18px; fill: #D55E00; }
      .bm-instrument { fill: #fbe9df; stroke: #D55E00; stroke-width: 2; }
    </style>
  </defs>

  <!-- ── the layout: atmosphere, ground, vegetation ── -->
  <rect x="0" y="0" width="1400" height="80" fill="#e8f1f8"/>
  <text class="bm-region" x="20" y="48">ATMOSPHERE (CO₂)</text>
  <rect x="0" y="400" width="1400" height="240" fill="#f3ece2"/>
  <line x1="0" y1="400" x2="1400" y2="400" stroke="#8a6d4b" stroke-width="2"/>
  <text class="bm-region" x="20" y="630">SOIL</text>
  <rect x="360" y="150" width="260" height="380" rx="18" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="10 6"/>
  <text class="bm-region" x="490" y="556" text-anchor="middle" style="fill:#009E73">VEGETATION</text>

  <!-- ── pools ── -->
  <g id="pools">
    <rect class="bm-pool" x="400" y="180" width="180" height="62" rx="8"/>
    <text class="bm-pool-name" x="490" y="220">Leaf</text>
    <rect class="bm-pool" x="400" y="292" width="180" height="62" rx="8"/>
    <text class="bm-pool-name" x="490" y="332">Wood</text>
    <rect class="bm-pool" x="400" y="440" width="180" height="62" rx="8"/>
    <text class="bm-pool-name" x="490" y="480">Roots</text>
    <rect class="bm-pool" x="790" y="500" width="260" height="70" rx="8"/>
    <text class="bm-pool-name" x="920" y="544">Soil carbon</text>
  </g>

  <!-- ── fluxes ── -->
  <g id="fluxes">
    <!-- GPP: from the atmosphere into the vegetation -->
    <line class="bm-flux" x1="440" y1="82" x2="440" y2="176"/>
    <text class="bm-flux-name" x="425" y="112" text-anchor="end">GPP</text>
    <text class="bm-flux-gloss" x="425" y="136" text-anchor="end">photosynthesis</text>
    <!-- R_a: from the vegetation to the atmosphere -->
    <line class="bm-flux" x1="545" y1="176" x2="545" y2="84"/>
    <text class="bm-flux-name" x="560" y="112">R<tspan baseline-shift="sub" font-size="17">a</tspan></text>
    <text class="bm-flux-gloss" x="560" y="136">plant respiration</text>
    <!-- litter and turnover: from the plant pools into soil carbon -->
    <path class="bm-flux" d="M582,212 C700,212 760,330 830,496"/>
    <path class="bm-flux" d="M582,324 C680,324 760,400 880,496"/>
    <path class="bm-flux" d="M582,470 C660,470 720,520 786,530"/>
    <text class="bm-flux-name" x="604" y="196">litterfall <tspan class="bm-flux-gloss">and turnover</tspan></text>
    <!-- R_h: from soil carbon to the atmosphere -->
    <line class="bm-flux" x1="1000" y1="496" x2="1000" y2="84"/>
    <text class="bm-flux-name" x="1015" y="300">R<tspan baseline-shift="sub" font-size="17">h</tspan></text>
    <text class="bm-flux-gloss" x="1015" y="324">decomposition</text>
    <!-- NEE, the net of the three -->
    <text class="bm-flux-name" x="1380" y="34" text-anchor="end">NEE = R<tspan baseline-shift="sub" font-size="17">a</tspan> + R<tspan baseline-shift="sub" font-size="17">h</tspan> − GPP</text>
    <text class="bm-flux-gloss" x="1380" y="62" text-anchor="end">net ecosystem exchange</text>
  </g>

  <!-- ── what is observed: shown from the "Observations" slide on ── -->
  <g id="observations">
    <rect class="bm-observed" x="396" y="176" width="188" height="70" rx="10"/>
    <rect class="bm-observed" x="396" y="288" width="188" height="70" rx="10"/>
    <rect class="bm-observed" x="786" y="496" width="268" height="78" rx="10"/>
    <text x="490" y="526" text-anchor="middle" style="font-size:18px; font-style:italic; fill:#56635b">not observed</text>

    <!-- MODIS, leaf area -->
    <g transform="translate(120,211)">
      <rect class="bm-instrument" x="-16" y="-12" width="32" height="24" rx="3"/>
      <rect class="bm-instrument" x="-58" y="-7" width="36" height="14"/>
      <rect class="bm-instrument" x="22" y="-7" width="36" height="14"/>
    </g>
    <line class="bm-beam" x1="182" y1="211" x2="392" y2="211"/>
    <text class="bm-observation-name" x="60" y="175">MODIS satellite</text>
    <text class="bm-observation-gloss" x="60" y="252">leaf area index</text>

    <!-- Landsat, biomass -->
    <g transform="translate(120,323)">
      <rect class="bm-instrument" x="-16" y="-12" width="32" height="24" rx="3"/>
      <rect class="bm-instrument" x="-58" y="-7" width="36" height="14"/>
      <rect class="bm-instrument" x="22" y="-7" width="36" height="14"/>
    </g>
    <line class="bm-beam" x1="182" y1="323" x2="392" y2="323"/>
    <text class="bm-observation-name" x="60" y="287">Landsat satellite</text>
    <text class="bm-observation-gloss" x="60" y="364">aboveground biomass</text>

    <!-- SoilGrids, soil carbon -->
    <g transform="translate(1210,535)">
      <rect class="bm-instrument" x="-34" y="-26" width="68" height="52"/>
      <line x1="-34" y1="-9" x2="34" y2="-9" stroke="#D55E00" stroke-width="1.5"/>
      <line x1="-34" y1="8" x2="34" y2="8" stroke="#D55E00" stroke-width="1.5"/>
      <line x1="-11" y1="-26" x2="-11" y2="26" stroke="#D55E00" stroke-width="1.5"/>
      <line x1="12" y1="-26" x2="12" y2="26" stroke="#D55E00" stroke-width="1.5"/>
    </g>
    <line class="bm-beam" x1="1170" y1="535" x2="1058" y2="535"/>
    <text class="bm-observation-name" x="1250" y="490" text-anchor="middle">Soil survey map</text>
    <text class="bm-observation-gloss" x="1250" y="592" text-anchor="middle">soil organic carbon</text>

    <!-- the flux tower, NEE -->
    <g stroke="#D55E00" stroke-width="2.5" fill="none">
      <line x1="1235" y1="400" x2="1255" y2="110"/>
      <line x1="1295" y1="400" x2="1275" y2="110"/>
      <path d="M1235,400 L1291,342 L1239,284 L1287,226 L1243,168 L1279,128"/>
      <path d="M1295,400 L1239,342 L1291,284 L1243,226 L1287,168 L1251,128"/>
      <line x1="1265" y1="110" x2="1330" y2="110"/>
    </g>
    <circle class="bm-instrument" cx="1336" cy="110" r="9"/>
    <line class="bm-beam" x1="1300" y1="102" x2="1300" y2="74"/>
    <text class="bm-observation-name" x="1320" y="200">Flux</text>
    <text class="bm-observation-name" x="1320" y="226">tower</text>
    <text class="bm-observation-gloss" x="1320" y="252">NEE</text>
  </g>
</svg>
